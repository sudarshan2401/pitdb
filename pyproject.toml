[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitdb"
version = "0.1.0"
description = "Point-in-time correct financial data store for AI agents, built on kdb-x"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["finance", "kdb", "bitemporal", "time-series", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database",
]
dependencies = [
    "pykx==4.0.0b5",  # KDB-X Community Edition — bundles the license
    "yfinance>=0.2.0",
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "mcp>=1.0.0",
    "click>=8.0.0",
]

[project.scripts]
pitdb = "pitdb.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit live external APIs (yfinance, SEC EDGAR)",
]
